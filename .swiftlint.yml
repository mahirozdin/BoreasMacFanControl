# Boreas — SwiftLint configuration
# Source: AGENTS.md §6 · docs/development/setup.md

included:
  - Packages
  - App
  - Daemon
  - CLI

excluded:
  - "**/.build"
  - "**/Tests/Fixtures"

# --------------------------------------------------------------------------
# Invariant T1: warnings count as errors. No broken windows.
# --------------------------------------------------------------------------
strict: true

opt_in_rules:
  - force_unwrapping          # AGENTS.md §6.2 — force unwrapping banned in Core
  - implicitly_unwrapped_optional
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - closure_spacing
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - fatal_error_message        # fatal_error must state its reason
  - discouraged_optional_boolean

disabled_rules:
  - todo                       # the TODO.md system exists; code TODOs move to the task list
  # Formatting belongs to swift-format. These rules CONFLICT with it:
  # swift-format adds trailing commas to multiline literals while SwiftLint
  # banned them — every 'make format' broke 'make lint'.
  # The boundary is clear: swift-format checks form, SwiftLint checks meaning.
  - trailing_comma
  - opening_brace
  - vertical_whitespace

line_length:
  warning: 110
  error: 140
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, up, dx, dy, rc, ok]

type_body_length: { warning: 300, error: 450 }
function_body_length: { warning: 60, error: 100 }
file_length: { warning: 450, error: 700 }
cyclomatic_complexity: { warning: 10, error: 18 }

# --------------------------------------------------------------------------
# Custom rules — catch the invariants at the lint layer too
# --------------------------------------------------------------------------
custom_rules:
  no_hardcoded_user_string:
    name: "Hard coded user facing text"
    regex: '\b(Text|Label|Button)\(\s*"[^"]{2,}"'
    match_kinds: [identifier, string]
    message: "Invariant Y1: use String(localized:comment:). See AGENTS.md §2.8"
    severity: error

  no_print_statements:
    name: "Logger instead of print"
    # NOTE: in SwiftLint '^' anchors to the start of the FILE, not the
    # line. A word boundary + identifier kind is used; the word "print"
    # inside comments and strings does not match.
    regex: '\bprint\s*\('
    match_kinds: [identifier]
    message: "Use OSLog/Logger. print() must not survive into production code."
    severity: error
