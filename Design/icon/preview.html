<meta charset="utf-8">
<title>Boreas icon preview</title>
<style>
  body { margin:0; font:13px -apple-system,system-ui,sans-serif; background:#f2f2f7; color:#1c1c1e; }
  .wrap { padding:24px 32px; }
  h2 { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
       color:#6e6e73; margin:28px 0 12px; }
  .row { display:flex; align-items:flex-end; gap:28px; flex-wrap:wrap; }
  .cell { text-align:center; }
  .cap { margin-top:8px; color:#8e8e93; font-size:11px; font-variant-numeric:tabular-nums; }
  .icon { position:relative; overflow:hidden; }
  .icon img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* macOS 26 squircle approximation — system applies the real mask */
  .mask { border-radius:22.5%; }
  .dark { background:#1c1c1e; }
  .dark .cap { color:#98989d; }
  .panel { padding:20px 24px; border-radius:14px; background:#fff; }
  .dark.panel { background:#000; }
  .dockbar { display:flex; align-items:center; gap:14px; padding:12px 18px;
             border-radius:20px; background:rgba(255,255,255,.72);
             box-shadow:0 8px 30px rgba(0,0,0,.18); backdrop-filter:blur(20px); }
  .dot { width:56px; height:56px; border-radius:14px; }
  .g1 { background:linear-gradient(160deg,#ff8a5b,#e8455a); }
  .g2 { background:linear-gradient(160deg,#7ee08a,#1f9d55); }
  .g3 { background:linear-gradient(160deg,#b18cff,#6c3bd6); }
</style>
<div class="wrap">

  <h2>Size scale — system mask applied</h2>
  <div class="row panel">
    <div class="cell"><div class="icon mask" style="width:256px;height:256px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">256</div></div>
    <div class="cell"><div class="icon mask" style="width:128px;height:128px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">128</div></div>
    <div class="cell"><div class="icon mask" style="width:64px;height:64px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">64</div></div>
    <div class="cell"><div class="icon mask" style="width:32px;height:32px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">32</div></div>
    <div class="cell"><div class="icon mask" style="width:16px;height:16px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">16</div></div>
  </div>

  <h2>Unmasked source (1024 canvas, margin check)</h2>
  <div class="row panel">
    <div class="cell"><div class="icon" style="width:256px;height:256px;outline:1px dashed #c7c7cc">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">unmasked</div></div>
    <div class="cell"><div class="icon" style="width:256px;height:256px;outline:1px dashed #c7c7cc">
      <img src="boreas-foreground.svg"></div><div class="cap">front layer only</div></div>
    <div class="cell"><div class="icon mask" style="width:256px;height:256px">
      <img src="boreas-background.svg"></div><div class="cap">back layer only</div></div>
  </div>

  <h2>Dock context</h2>
  <div class="row panel" style="background:linear-gradient(140deg,#8ec5e8,#c9a7e0 60%,#f0b49a)">
    <div class="dockbar">
      <div class="dot g1"></div>
      <div class="icon mask" style="width:56px;height:56px">
        <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div>
      <div class="dot g2"></div>
      <div class="dot g3"></div>
    </div>
  </div>

  <h2>Dark theme</h2>
  <div class="row panel dark">
    <div class="cell"><div class="icon mask" style="width:128px;height:128px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">128</div></div>
    <div class="cell"><div class="icon mask" style="width:32px;height:32px">
      <img src="boreas-background.svg"><img src="boreas-foreground.svg"></div><div class="cap">32</div></div>
  </div>

</div>
