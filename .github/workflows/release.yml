name: Release

# P8.04 — the signing chain, automated.
#
# Two ways in, and the difference is only what happens at the very end:
#
#   push a v* tag      → build, sign, notarise, staple, and PUBLISH a release
#   workflow_dispatch  → the identical chain, but the DMG is uploaded as a
#                        build artifact and nothing is published
#
# The dry run exists because the chain has to be provable before anybody is
# ready to release. Proving it by tagging would mean publishing v0.1.0 of
# software whose own TODO still lists an outstanding accessibility pass — the
# evidence would cost more than it is worth.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Sign, notarise, package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then echo "::error::No Xcode found"; exit 1; fi
          sudo xcode-select -s "$NEWEST"
          swift --version

      # ------------------------------------------------------------------
      # B2: no release with a red gate. Run them before spending a
      # notarisation round trip on a build that should not ship.
      # ------------------------------------------------------------------
      - name: Gates
        run: make check

      - name: Tests
        run: make test

      - name: Install XcodeGen
        run: brew install xcodegen

      # ------------------------------------------------------------------
      # The signing identity, in a keychain that exists for this job only.
      # ------------------------------------------------------------------
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not set — see M03 in TODO.md"
            exit 1
          fi
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN=build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without this the keychain relocks mid-build and codesign fails with
          # an error that names none of this.
          security set-keychain-settings -lut 3600 "$KEYCHAIN"

          # **The search list, not just the default.** `default-keychain` only
          # says where new items go; `find-identity` and `codesign` read the
          # search list, and a keychain missing from it holds a certificate
          # nobody can see. The first run of this job imported the identity
          # successfully and then reported "0 valid identities found".
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          # `set -o pipefail` matters here and its absence cost a run: piping
          # `security import` into `sed` returned sed's status, so a failed
          # import looked like a successful one and the step carried on to
          # report zero identities without ever saying why.
          set -o pipefail

          printf '%s' "$P12_BASE64" | base64 --decode > cert.p12
          BYTES=$(wc -c < cert.p12 | tr -d ' ')
          echo "    decoded $BYTES bytes from the secret"
          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::the decoded .p12 is $BYTES bytes — the secret looks truncated or is not base64"
            exit 1
          fi

          # **Is this actually a .p12?** A DER certificate and a PKCS#12 archive
          # share their first bytes, so a size check cannot tell them apart —
          # but only the certificate parses as one, and that needs no password.
          # Worth the four lines: the failure it names is the easy mistake to
          # make, since Apple's own download is a .cer.
          if openssl x509 -inform DER -in cert.p12 -noout -subject >/dev/null 2>&1; then
            echo "::error::this is a DER certificate (.cer), not a .p12 archive"
            echo "  A .cer holds the certificate only. Signing needs the PRIVATE KEY too,"
            echo "  which never leaves your Mac in an Apple download — it is created locally"
            echo "  and lives in your keychain. Export the pair instead:"
            echo "    Keychain Access -> login -> My Certificates -> expand the"
            echo "    'Developer ID Application' row, confirm a key is listed under it,"
            echo "    select the certificate, right-click -> Export -> .p12"
            echo "  Then: base64 -i cert.p12 | pbcopy, and replace DEVELOPER_ID_P12_BASE64."
            exit 1
          fi

          # What the file actually is, before trying to import it. None of this
          # prints key material: a type name, and whether the bytes begin with
          # the PEM armour that says "this is text, not a PKCS#12".
          echo "    file type: $(file -b cert.p12)"
          if head -c 11 cert.p12 | grep -q -- "-----BEGIN"; then
            echo "::error::this is a PEM text file, not a binary .p12 archive"
            echo "  Export from Keychain Access as 'Personal Information Exchange (.p12)'."
            exit 1
          fi

          # **What is in the archive, before importing it.** `security import`
          # accepts a .p12 holding only a private key, succeeds, prints nothing
          # and leaves no signing identity behind — which is exactly what
          # happened here for six runs. `-info -noout` prints bag types and
          # algorithm names only: no key material, no certificate contents.
          # `-legacy` first: Keychain Access encrypts the certificate bag with
          # RC2-40-CBC, which OpenSSL 3 moved into the legacy provider and will
          # not touch without being asked. Without this the check rejects a
          # perfectly good archive — it nearly did.
          BAGS=$(openssl pkcs12 -in cert.p12 -info -noout -legacy \
            -passin pass:"$P12_PASSWORD" 2>&1 \
            || openssl pkcs12 -in cert.p12 -info -noout \
               -passin pass:"$P12_PASSWORD" 2>&1 || true)
          HAS_CERT=$(printf '%s' "$BAGS" | grep -ci "certificate bag\|encrypted data" || true)
          HAS_KEY=$(printf '%s' "$BAGS" | grep -ci "keybag" || true)
          echo "    archive contains: $HAS_CERT certificate bag(s), $HAS_KEY key bag(s)"

          # **`security` is the authority here, not `openssl`.** If openssl
          # cannot read the archive's encryption at all, that says something
          # about openssl's build, not about the file — so the verdict is left
          # to the import below rather than guessed at from a failed parse.
          if printf '%s' "$BAGS" | grep -qiE "unsupported|error outputting"; then
            echo "    openssl cannot read this archive's legacy encryption;"
            echo "    leaving the verdict to security import, which can"
            HAS_CERT=-1
            HAS_KEY=-1
          fi

          if printf '%s' "$BAGS" | grep -qi "mac verify"; then
            echo "::error::the archive did not decrypt — DEVELOPER_ID_P12_PASSWORD does not match the one used at export"
            exit 1
          fi
          if [ "$HAS_KEY" -gt 0 ] && [ "$HAS_CERT" -eq 0 ]; then
            echo "::error::this .p12 holds the PRIVATE KEY but no certificate"
            echo "  In Keychain Access the certificate row was expanded and the KEY"
            echo "  beneath it was exported. Select the row above it — the one named"
            echo "  'Developer ID Application: …' — and export that instead; it carries"
            echo "  both halves. An identity is a certificate and its key together."
            exit 1
          fi
          if [ "$HAS_CERT" -gt 0 ] && [ "$HAS_KEY" -eq 0 ]; then
            echo "::error::this .p12 holds the certificate but no private key"
            echo "  Export from the 'My Certificates' category, not 'Certificates'."
            exit 1
          fi
          if [ "$HAS_CERT" -eq 0 ] && [ "$HAS_KEY" -eq 0 ]; then
            echo "::error::no certificate and no key in the archive — not a usable .p12"
            exit 1
          fi

          IMPORT_OUTPUT=$(security import cert.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security 2>&1) || IMPORT_FAILED=1
          printf '%s\n' "${IMPORT_OUTPUT:-(no output)}" | sed 's/^/    /'
          if [ -n "${IMPORT_FAILED:-}" ]; then
            case "$IMPORT_OUTPUT" in
              *MAC*|*password*|*decrypt*)
                echo "::error::the archive did not decrypt — DEVELOPER_ID_P12_PASSWORD does not match" ;;
              *)
                echo "::error::security import failed; its output is above" ;;
            esac
            exit 1
          fi
          # Lets codesign use the key without an interactive prompt, which a
          # runner has no way to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f cert.p12

          # **Counted, not glanced at.** `security find-identity` exits 0 with
          # no identities at all, so printing it proves nothing — the first run
          # of this job passed this step having imported nothing usable, which
          # is the silent pass this project refuses everywhere else.
          security find-identity -v -p codesigning | sed 's/^/    /'
          COUNT=$(security find-identity -v -p codesigning \
            | grep -c "Developer ID Application" || true)
          if [ "$COUNT" -eq 0 ]; then
            # **An identity is a certificate PLUS its private key.** A .p12 can
            # hold the certificate alone, and `security import` accepts it
            # without complaint — so the keychain ends up holding a certificate
            # that cannot sign anything. Distinguishing the two cases here turns
            # "0 identities" from a mystery into an instruction.
            CERTS=$(security find-certificate -a "$KEYCHAIN" \
              | grep -c "Developer ID Application" || true)
            if [ "$CERTS" -gt 0 ]; then
              echo "::error::the .p12 contains the certificate but NOT its private key"
              echo "  Re-export from Keychain Access under **My Certificates**, not"
              echo "  Certificates: expand the certificate's disclosure triangle, confirm a"
              echo "  private key is listed beneath it, and select the pair before exporting."
            else
              echo "::error::the .p12 imported nothing usable — wrong password, or not a p12"
            fi
            exit 1
          fi
          echo "  ✓ $COUNT Developer ID identity(ies) available" 

      - name: Write the local signing configuration
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TEAM" ]; then
            echo "::error::APPLE_TEAM_ID is not set — see M03 in TODO.md"
            exit 1
          fi
          # `make generate` seeds this from the example when absent (P7.15),
          # and the example signs nothing. The real team has to be written
          # before the project is generated.
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_IDENTITY = Developer ID Application\n' \
            "$TEAM" > Local.xcconfig

      - name: Generate the project
        run: make generate

      - name: Build the app and the CLI
        run: |
          set -o pipefail
          for scheme in Boreas boreas; do
            xcodebuild -project Boreas.xcodeproj -scheme "$scheme" \
              -configuration Release -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath build/release build | xcbeautify --quieter
          done

      - name: Sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          P=build/release/Build/Products/Release
          scripts/sign.sh "$P/Boreas.app" "$P/boreas"

      - name: Build the disk image
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          P=build/release/Build/Products/Release
          scripts/make-dmg.sh "$P/Boreas.app" "$P/boreas"

      # ------------------------------------------------------------------
      # B4: if this fails, nothing ships. The script exits non-zero on any
      # verdict other than Accepted, and prints Apple's own log when it does.
      # ------------------------------------------------------------------
      - name: Notarise and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize.sh build/dmg/*.dmg

      # The cask carries a version and a SHA-256, both of which are facts about
      # an artefact that did not exist until the step above. Generated here for
      # the same reason nothing else in this project is restated by hand.
      - name: Generate the Homebrew cask
        run: scripts/make-cask.sh build/dmg/*.dmg build/dmg/boreas.rb

      - name: Upload the disk image as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: boreas-dmg
          path: |
            build/dmg/*.dmg
            build/dmg/*.sha256
            build/dmg/boreas.rb
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Only a tag publishes. A dispatch run stops at the artifact above,
      # which is the whole point of having both.
      # ------------------------------------------------------------------
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release-notes.sh "$VERSION" > /tmp/notes.md
          # **A 0.x version is a pre-release by definition**, and marking it so
          # is the difference between GitHub offering it as *the* download and
          # offering it as one to try. The rule is the version, not a flag
          # somebody has to remember.
          PRERELEASE=""
          case "$VERSION" in
            0.*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME} — beta" \
            --notes-file /tmp/notes.md \
            $PRERELEASE \
            build/dmg/*.dmg build/dmg/*.sha256 build/dmg/boreas.rb
