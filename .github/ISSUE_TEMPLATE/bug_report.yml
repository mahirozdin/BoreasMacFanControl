name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Please do not include personal data in logs."
  - type: input
    id: model
    attributes:
      label: Mac model identifier
      description: "Run: sysctl -n hw.model"
      placeholder: Mac16,10
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: "26.5.2"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Boreas version
      placeholder: "0.1.0"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations: { required: true }
  - type: checkboxes
    id: fan
    attributes:
      label: Fan control
      options:
        - label: The fan helper is installed
        - label: The problem also happens with fan control disabled
