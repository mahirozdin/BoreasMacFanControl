# Boreas — XcodeGen project definition
#
# The .xcodeproj is GENERATED from this file and never committed (invariant T5).
# To generate: make generate
#
# THE PRODUCT NAME LIVES IN ONE PLACE: the PRODUCT_NAME / BUNDLE_PREFIX
# variables below. Renaming: scripts/rename-product.sh (invariant K2)

name: Boreas

options:
  bundleIdPrefix: com.bubiapps
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    PRODUCT_NAME: Boreas
    BUNDLE_PREFIX: com.bubiapps.boreas
    ARCHS: arm64                    # ADR 0004 — Apple Silicon only
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_EMIT_LOC_STRINGS: YES   # P6.11 — the compiler extracts into the String Catalog
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES     # blueprint §14.1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Core:
    path: Packages/Core
  HardwareKit:
    path: Packages/HardwareKit
  SharedIPC:
    path: Packages/SharedIPC

targets:

  # ------------------------------------------------------------------ app
  Boreas:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
      # The launchd definition has to sit beside the binary.
      - path: Daemon/com.bubiapps.boreas.fanhelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: Core
      - package: HardwareKit
      - package: SharedIPC
      - target: BoreasFanHelper
        embed: true
        codeSign: true
        copy:
          # SMAppService looks for both the launchd plist and the binary
          # at this path INSIDE the application bundle.
          destination: wrapper
          subpath: Contents/Library/LaunchDaemons
    info:
      path: App/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # Menu bar application: no Dock icon (blueprint §9.2)
        LSUIElement: true
        NSHumanReadableCopyright: "Licensed under the Apache License 2.0"
        # Where the unknown-sensor report (P7.09) files its issue. It lives
        # here rather than in Swift because the address contains the product
        # name, and K2 keeps that out of the code.
        BORepositoryURL: https://github.com/mahirozdin/boreas-mac-fan-control
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubiapps.boreas
        CODE_SIGN_STYLE: Manual
        # DEVELOPMENT_TEAM and CODE_SIGN_IDENTITY come from Local.xcconfig.
        # Without the file the build is unsigned — enough for the packages
        # and the CLI, not for the privileged helper (ADR 0019).

  # ------------------------------------------------------------------ cli
  boreas:
    type: tool
    platform: macOS
    sources:
      - path: CLI/Sources
    dependencies:
      - package: Core
      - package: HardwareKit
      - package: SharedIPC
    settings:
      base:
        PRODUCT_NAME: boreas
        PRODUCT_BUNDLE_IDENTIFIER: com.bubiapps.boreas.cli

  # ------------------------------------------------------------------ daemon
  BoreasFanHelper:
    type: tool
    platform: macOS
    sources:
      - path: Daemon/Sources
    dependencies:
      - package: Core
      - package: HardwareKit
      - package: SharedIPC
    info:
      path: Daemon/Info.plist
      properties:
        CFBundleIdentifier: com.bubiapps.boreas.fanhelper
        CFBundleName: BoreasFanHelper
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_NAME: com.bubiapps.boreas.fanhelper
        PRODUCT_BUNDLE_IDENTIFIER: com.bubiapps.boreas.fanhelper
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
        # The signing identifier of a command line tool follows this. Left
        # unset it inherits the app's and the XPC requirement stops matching.
        PRODUCT_BUNDLE_IDENTIFIER: com.bubiapps.boreas.fanhelper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

schemes:
  Boreas:
    build:
      targets: { Boreas: all }
    run:
      config: Debug
    test:
      config: Debug

  # The CLI needs its own scheme: xcodebuild -target does not resolve the
  # SPM package graph, -scheme does.
  boreas:
    build:
      targets: { boreas: all }
    run:
      config: Debug

  BoreasFanHelper:
    build:
      targets: { BoreasFanHelper: all }
